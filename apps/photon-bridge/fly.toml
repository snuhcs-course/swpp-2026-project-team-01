# App reserved in the personal organization; no Machine deployed as of 2026-10-05.
app = "fmat-photon-bridge"
primary_region = "nrt"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Replace the single subscriber in place; do not create a blue/green peer.
  strategy = "immediate"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  FMAT_API_URL = "https://anelszynxtvxoxqvzgqt.supabase.co/functions/v1/api"
  # PHOTON_BRIDGE_ENABLED and all credentials are supplied by Fly secrets.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/ready"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[[restart]]
  policy = "always"
