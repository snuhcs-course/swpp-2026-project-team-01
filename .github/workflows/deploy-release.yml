name: Deploy release Supabase

# Only this workflow changes the release project (operations-and-release D13).
# It never runs on its own: a person starts it on main, and the GitHub
# environment "release" holds its secrets and variables and can require a
# reviewer's approval before the job starts. It applies the reviewed migration
# chain after printing the dry run, the worker's Vault entries and the hosted
# configuration declared in supabase/config.toml, as Deploy shared Supabase does
# for the shared project.
on:
  workflow_dispatch:

concurrency:
  group: deploy-release-supabase
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: mriseqztcwmezvtawnbo
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Refuse any ref but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Release migrations come only from main; this run is on $GITHUB_REF." >&2
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.119.0
      - name: Link the release project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Refuse a release project that was not emptied
        run: |
          # The project held the iteration-1 prototype's fmat schema when it was
          # inspected on 2026-10-23; nothing is pushed onto it until it is emptied.
          leftover=$(supabase db query --linked "select count(*)::int as n from pg_namespace where nspname = 'fmat'" | jq -r '.rows[0].n')
          if [ "$leftover" != "0" ]; then
            echo "The release project still holds the prototype's fmat schema; empty it first." >&2
            exit 1
          fi
      - name: Show pending migrations
        run: supabase db push --dry-run
      - name: Push migrations
        run: supabase db push --yes
      - name: Write the worker URL and secret into Vault
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: |
          if [ -z "$WORKER_URL" ] || [ -z "$WORKER_SECRET" ]; then
            echo "WORKER_URL or WORKER_SECRET is not set; leaving Vault unchanged, so wake-ups stay inert."
            exit 0
          fi
          # Both values are interpolated into SQL, so accept only characters that cannot end a literal.
          if ! printf '%s' "$WORKER_URL" | grep -Eq '^https://[A-Za-z0-9./_-]+$'; then
            echo "WORKER_URL must be an https URL of letters, digits, '.', '/', '_' or '-'." >&2
            exit 1
          fi
          if ! printf '%s' "$WORKER_SECRET" | grep -Eq '^[A-Za-z0-9_-]{32,}$'; then
            echo "WORKER_SECRET must be at least 32 letters, digits, '_' or '-'." >&2
            exit 1
          fi
          upsert() {
            echo "perform vault.update_secret(id, '$2') from vault.secrets where name = '$1';"
            echo "if not found then perform vault.create_secret('$2', '$1'); end if;"
          }
          sql_file="$RUNNER_TEMP/worker-vault.sql"
          {
            echo 'do $do$ begin'
            upsert worker_url "$WORKER_URL"
            upsert worker_secret "$WORKER_SECRET"
            echo 'end $do$;'
          } > "$sql_file"
          supabase db query --linked --file "$sql_file" > /dev/null
          rm -f "$sql_file"
      - name: Push hosted configuration
        env:
          SUPABASE_AUTH_SITE_URL: ${{ vars.SUPABASE_AUTH_SITE_URL }}
          SUPABASE_AUTH_ADDITIONAL_REDIRECT_URLS: ${{ vars.SUPABASE_AUTH_ADDITIONAL_REDIRECT_URLS }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          for name in SUPABASE_AUTH_SITE_URL SUPABASE_AUTH_ADDITIONAL_REDIRECT_URLS GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "Set $name in the repository variables or secrets." >&2
              exit 1
            fi
          done
          supabase config diff --project-ref "$SUPABASE_PROJECT_REF"
          supabase config push --project-ref "$SUPABASE_PROJECT_REF" --yes
