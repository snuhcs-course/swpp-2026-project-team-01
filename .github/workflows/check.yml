name: Check
on:
  push:
  pull_request:
jobs:
  repository:
    runs-on: ubuntu-latest
    env:
      OPENAI_MODEL: gpt-6-luna
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check documentation, application types and unit tests
        run: npm run check
      - name: Build independent eve and web services
        run: npm run build
      - name: Smoke test production servers
        run: npm run test:runtime
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - run: supabase start
      - run: supabase db reset --local
      - name: Verify preserved database baseline
        id: database_baseline
        run: supabase test db
      - name: Verify Auth and application database integration
        run: npm run test:integration
      - name: Verify authorized eve conversations and process-kill recovery
        run: npm run test:conversations
      - name: Build browser application
        run: npm run build:web
        env:
          OPENAI_MODEL: gpt-6-luna
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Verify browser access, conversation replay and revocation
        id: browser
        run: npm run test:browser
      - name: Verify database invariants after fixture cleanup
        if: ${{ !cancelled() && steps.database_baseline.outcome == 'success' }}
        run: supabase test db
      - name: Preserve synthetic browser failure evidence
        if: failure() && steps.browser.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.run_id }}
          retention-days: 7
          path: |
            .local/rebuild/browser-control-failure.json
            .local/rebuild/private-checkbox-trace.json
            .local/rebuild/scheduling-failure.json
            .local/rebuild/browser-screenshots/scheduling-failure.png
            .local/rebuild/browser-screenshots/last-state.png
