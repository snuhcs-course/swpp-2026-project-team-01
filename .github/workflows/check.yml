name: Check
on:
  push:
  pull_request:
jobs:
  repository:
    runs-on: ubuntu-latest
    env:
      OPENAI_MODEL: gpt-6-luna
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check documentation, application types and unit tests
        run: npm run check
      - name: Build independent eve and web services
        run: npm run build
      - name: Smoke test production servers
        run: npm run test:runtime
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - run: supabase start
      - run: supabase db reset --local
      - name: Verify preserved database baseline
        run: supabase test db
      - name: Verify Auth and application database integration
        run: npm run test:integration
