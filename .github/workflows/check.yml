name: Check
on:
  push:
  pull_request:
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check documentation links
        run: npm run check:docs
      - name: Validate OpenSpec artifacts
        run: npx --yes @fission-ai/openspec@1.14.0 validate --all --strict
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
  database:
    runs-on: ubuntu-latest
    env:
      SUPABASE_AUTH_SITE_URL: http://localhost:3000
      SUPABASE_AUTH_ADDITIONAL_REDIRECT_URLS: http://localhost:3000/auth/callback
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Start the local stack and apply the migration chain
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Database tests
        run: supabase test db
